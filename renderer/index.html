<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Wisp</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas {
    display: block; width: 96px; height: 96px; image-rendering: pixelated;
    opacity: 0; transition: opacity .35s ease;
  }
  body.on canvas { opacity: 1; }
  body.over canvas { cursor: pointer; }
</style>
</head>
<body>
  <canvas id="c" width="24" height="24"></canvas>
  <script src="sprites.js"></script>
  <script src="wisp.js"></script>
</body>
</html>
